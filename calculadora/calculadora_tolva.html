
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira - Projeto PI</title>
</head>

<body>

    <h1>Calculadora Financeira - Projeto PI</h1>

    <h2>Dados do Cliente</h2>

    Insumo Processado (kg/mês):
    <input id="input_massa" type="number" value="600000">
    <br><br>

    Rendimento do Processo (%):
    <input id="input_rendimento" type="number" value="43.5">
    <br><br>

    Perda por Transbordo (%):
    <input id="input_perda" type="number" value="5">
    <br><br>

    Valor do Produto Final (R$/kg):
    <input id="input_valor" type="number" value="2.50">
    <br><br>

    Horas Paradas por Mês:
    <input id="input_horas" type="number" value="6">
    <br><br>

    Custo da Hora Parada (R$/hora):
    <input id="input_custoHora" type="number" value="1200">
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <h2>Resultados</h2>

    <p id="div_massaPerdida"></p>

    <p id="div_produtoNaoGerado"></p>

    <p id="div_prejuizoTransbordo"></p>

    <p id="div_prejuizoDowntime"></p>

    <p id="div_prejuizoMensal"></p>

    <p id="div_prejuizoAnual"></p>

    <h2>Ganho Potencial com a Solução</h2>

    <p id="div_ganhoDireto"></p>

    <p id="div_ganhoIndireto"></p>

    <p id="div_valorTotal"></p>

    <h2>Projeção</h2>

    <p id="div_ano1"></p>

    <p id="div_ano3"></p>


    <script>

        let massa;
        let rendimento;
        let perda;
        let valor;
        let horas;
        let custoHora;

        let massaPerdida;
        let produtoNaoGerado;
        let prejuizoTransbordo;
        let prejuizoDowntime;
        let prejuizoMensal;
        let prejuizoAnual;

        let ganhoDireto;
        let ganhoIndireto = 25000;
        let valorTotal;

        let ano1;
        let ano3;


        function calcular() {

            massa = Number(input_massa.value);
            rendimento = Number(input_rendimento.value);
            perda = Number(input_perda.value);
            valor = Number(input_valor.value);
            horas = Number(input_horas.value);
            custoHora = Number(input_custoHora.value);


            massaPerdida = massa * (perda / 100);  // Massa perdida

            produtoNaoGerado = massaPerdida * (rendimento / 100);   // Produto não gerado

            prejuizoTransbordo = produtoNaoGerado * valor;   // Prejuízo por transbordo

            prejuizoDowntime = horas * custoHora;  // Prejuízo por downtime

            prejuizoMensal = prejuizoTransbordo + prejuizoDowntime; // Prejuízo mensal

            prejuizoAnual = prejuizoMensal * 12;  // Prejuízo anual x 12 meses

            ganhoDireto = prejuizoAnual * 0.85;  // Ganho direto com 85% de eficiencia

            valorTotal = ganhoDireto + ganhoIndireto; // Ganho total


            // Projeções

            ano1 = valorTotal;

            ano3 = valorTotal * 3;


            // Mostrar resultados

            div_massaPerdida.innerHTML =
                "Massa Perdida: " + massaPerdida + " kg";


            div_produtoNaoGerado.innerHTML =
                "Produto Não Gerado: " + produtoNaoGerado + " kg";


            div_prejuizoTransbordo.innerHTML =
                "Prejuízo por Transbordo: R$ " + prejuizoTransbordo;


            div_prejuizoDowntime.innerHTML =
                "Prejuízo por Downtime: R$ " + prejuizoDowntime;


            div_prejuizoMensal.innerHTML =
                "Prejuízo Total Mensal: R$ " + prejuizoMensal;


            div_prejuizoAnual.innerHTML =
                "Prejuízo Total Anual: R$ " + prejuizoAnual;


            div_ganhoDireto.innerHTML =
                "Ganho Direto (85%): R$ " + ganhoDireto;


            div_ganhoIndireto.innerHTML =
                "Ganho Indireto: R$ " + ganhoIndireto;


            div_valorTotal.innerHTML =
                "VALOR TOTAL GERADO: R$ " + valorTotal + " / ano";


            div_ano1.innerHTML =
                "Valor gerado em 1 ano: R$ " + ano1;


            div_ano3.innerHTML =
                "Valor gerado em 3 anos: R$ " + ano3;

        }

    </script>

</body>

</html>
